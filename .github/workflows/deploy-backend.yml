name: Deploy Backend (Railway)

on:
  workflow_dispatch: # manual only — Railway auto-deploys from GitHub natively

jobs:
  deploy-backend:
    name: Deploy FastAPI to Railway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        working-directory: backend
        run: |
          railway up \
            --service "${{ secrets.RAILWAY_SERVICE_NAME }}" \
            --project "${{ secrets.RAILWAY_PROJECT_ID }}" \
            --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Confirm deploy
        run: echo "✅ Backend deployed to Railway"
