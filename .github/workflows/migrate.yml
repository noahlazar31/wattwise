name: Supabase Migration

on:
  push:
    branches: [main]
    paths:
      - "backend/migrations/**"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  migrate:
    name: Run SQL migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Run migrations via psql
        # Uses the Supabase direct Postgres connection string.
        # The migration is idempotent (CREATE TABLE IF NOT EXISTS) so safe to re-run.
        run: |
          psql "${{ secrets.SUPABASE_DB_URL }}" \
            -f backend/migrations/001_initial_schema.sql \
            --set ON_ERROR_STOP=1
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Confirm migration
        run: echo "✅ Migration complete"
